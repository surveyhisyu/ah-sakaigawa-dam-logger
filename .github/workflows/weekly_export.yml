name: 境川ダムデータ週次まとめ

on:
  schedule:
    - cron: "5 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリのインストール
        run: pip install pandas

      - name: 週次まとめファイルを作成
        run: python weekly_export.py

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly/
          git diff --staged --quiet || git commit -m "週次まとめ: $(date -u +'%Y-%m-%d')"
          git push
